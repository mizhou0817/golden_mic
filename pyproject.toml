[project]
name = "golden-mic"
version = "1.0.0"
description = "Single-node AI news video editing service"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.139.2",
    "starlette==1.3.1",
    "uvicorn[standard]==0.51.0",
    "click==8.3.3",
    "python-multipart==0.0.32",
    "pydantic-settings==2.14.2",
    "packaging==26.0",
    "httpx==0.28.1",
    "scenedetect==0.7.1",
    "opencv-python-headless==5.0.0.93",
    "edge-tts==7.2.8",
    "websockets==16.1.1",
    "jieba==0.42.1",
    "opencc-python-reimplemented==0.1.7",
    "silero-vad-lite==0.2.1",
]

[tool.uv]
package = false
required-version = ">=0.11.11,<0.12"
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
compile-bytecode = true

[tool.uv.sources]
scenedetect = { path = "vendor/scenedetect-0.7.1-py3-none-any.whl" }
