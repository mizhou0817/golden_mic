# goldmic vhost for a shared nginx (宝塔): every zone/upstream name is goldmic_-prefixed.
# __DOMAIN__ is replaced at install time. The HTTPS block is enabled once the certificate exists.
limit_req_zone $binary_remote_addr zone=goldmic_create:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=goldmic_connection:10m;
limit_conn_zone $binary_remote_addr zone=goldmic_upload:10m;

upstream goldmic_backend {
    server 127.0.0.1:18765;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    location ^~ /.well-known/acme-challenge/ {
        root /opt/goldmic/acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

